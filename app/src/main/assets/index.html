<style>
/* Futuristisches HUD: dunkler Grund mit feinem Raster, Cyan-Violett-Leuchten, Orbitron-Titel. */
:root{

  --accent:#36e0ff; --accent2:#7a5cff; --acct:#36e0ff; --mid:#5b8cff; --on:#04101a; --acc-rgb:54,224,255; --acc2-rgb:122,92,255; --glow:rgba(54,224,255,.28);
  --pa:rgba(15,26,46,.5); --pb:rgba(11,18,32,.42); --pc:rgba(11,18,32,.3); --pd:rgba(11,18,32,.35); --pq:rgba(11,18,32,.7); --pe:rgba(5,8,15,.4); --shade:rgba(0,0,0,.55); --gold:#ffcf66; --gold-bg:rgba(255,207,102,.1);

}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh;

  background-size:auto,auto,36px 36px,36px 36px;background-attachment:fixed;
  padding:0 max(16px,env(safe-area-inset-left,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:760px;margin:0 auto;position:relative;z-index:1}
#netz{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{padding-top:max(22px,env(safe-area-inset-top,0px));display:flex;align-items:center;gap:14px}
header img{width:46px;height:46px;border-radius:12px;box-shadow:0 0 18px var(--glow);border:1px solid var(--line)}

mark{background:rgba(var(--acc-rgb),.28);color:inherit;border-radius:3px;padding:0 1px}

.empty{padding:24px 0;color:var(--muted)}

.cl details{border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03)}

.cl .e .w{font-size:12px;color:var(--muted)}.cl .e code{justify-self:start;color:var(--acct);font-family:var(--mono,monospace);font-size:14px}

.link:hover{border-color:var(--acct)}
.big{font-family:var(--display);font-size:38px;letter-spacing:.03em;color:var(--acct);text-shadow:0 0 22px var(--glow);line-height:1}
.files{display:grid;gap:12px}
.file{display:grid;gap:5px}
.file .r{display:flex;justify-content:space-between;gap:10px;font-size:14px}

.meter{height:7px;border-radius:99px;background:var(--line);overflow:hidden}

.zahlen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.zahl{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--pd)}
.zahl b{display:block;font-family:var(--display);font-size:20px;color:var(--fg)}
.zahl small{color:var(--muted);font-size:12px}
.foot{margin:34px 0 0;padding-top:18px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px;display:grid;gap:4px}
#toast{z-index:50;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--on);font-weight:600;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 0 20px var(--glow);max-width:90vw;overflow-wrap:anywhere}
#toast.on{opacity:1}
/* Ladebildschirm: Symbol dreht sich und fliegt auf den Betrachter zu */
#boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:22px;background:radial-gradient(600px 400px at 50% 45%,rgba(var(--acc-rgb),.18),transparent 70%),var(--bg)}
#boot .ring{position:absolute;width:210px;height:210px;border-radius:50%;border:1px solid rgba(var(--acc-rgb),.35);border-top-color:var(--acct);animation:spin 1.1s linear infinite}
#boot .ring.r2{width:250px;height:250px;border-color:rgba(var(--acc2-rgb),.25);border-bottom-color:var(--accent2);animation-duration:1.7s;animation-direction:reverse}
#boot .logo{width:150px;height:150px;border-radius:32px;border:1px solid var(--line);box-shadow:0 0 50px var(--glow);animation:logospin 1.5s cubic-bezier(.5,0,.3,1) both}
#boot .name{position:absolute;bottom:22%;font-family:var(--display);letter-spacing:.2em;font-size:15px;color:var(--muted);animation:pulse 1.1s ease-in-out infinite}
#boot.go{pointer-events:none;animation:bgfade .6s ease .15s forwards}
#boot.go .logo{animation:fly .7s cubic-bezier(.6,0,.9,.5) forwards}
#boot.go .ring,#boot.go .name{animation:none;opacity:0;transition:opacity .2s}
#app{animation:appin .6s ease backwards;animation-play-state:paused}
body.ready #app{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes logospin{0%{transform:rotate(-360deg) scale(.4);opacity:0}60%{opacity:1}100%{transform:rotate(0) scale(1);opacity:1}}
@keyframes fly{0%{transform:scale(1);opacity:1}100%{transform:scale(16);opacity:0}}
@keyframes bgfade{to{opacity:0}}
@keyframes pulse{50%{opacity:.4}}
@keyframes appin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#boot .ring,#boot .name,#boot .logo{animation:none}#boot.go .logo{animation:none;opacity:0}#boot.go{animation:bgfade .2s forwards}#app{animation:none}}

:root[data-mode="light"]{

header{position:relative}

<script>
/* Netz im Hintergrund: Punkte schweben, nahe Punkte verbinden sich. Beim Berühren verbinden sich Punkte in der Nähe mit dem Finger, beim Loslassen löst sich das wieder. */
(function(){
  var c=document.getElementById("netz"),x=c.getContext("2d"),W=0,H=0,D=1,P=[],T=null,lastT=null,fade=0;
  var reduziert=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
  var ABST=130, TABST=210;
  function groesse(){D=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);
    var n=Math.round(Math.max(28,Math.min(70,Math.round(W*H/11000)))*({wenig:.5,mittel:1,viel:1.7}[CFG.dichte]||1));
    while(P.length<n)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.45,r:1.3+Math.random()*1.6});
    P.length=n;}
  function rgba(a,k){return "rgba("+(k?CFG.rb:CFG.ra)+","+a+")"}
  function schritt(){
    if(!CFG.netz){if(c.style.display!=="none")c.style.display="none";requestAnimationFrame(schritt);return}
    if(c.style.display==="none")c.style.display="";
    x.clearRect(0,0,W,H);
    var i,j,p,q,dx,dy,d;
    for(i=0;i<P.length;i++){p=P[i];
      if(!reduziert){var sp={langsam:.5,normal:1,schnell:2}[CFG.tempo]||1;p.x+=p.vx*sp;p.y+=p.vy*sp;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;}}
    x.lineWidth=1;
    for(i=0;i<P.length;i++)for(j=i+1;j<P.length;j++){p=P[i];q=P[j];dx=p.x-q.x;dy=p.y-q.y;d=Math.sqrt(dx*dx+dy*dy);
      if(d<ABST){x.strokeStyle=rgba(.38*(1-d/ABST));x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();}}
    var a=T?1:fade, tt=T||lastT;
    if(a>0&&tt){
      for(i=0;i<P.length;i++){p=P[i];dx=p.x-tt.x;dy=p.y-tt.y;d=Math.sqrt(dx*dx+dy*dy);

function hinweis(t){toast.textContent=t;toast.classList.add("on");clearTimeout(hinweis.t);hinweis.t=setTimeout(()=>toast.classList.remove("on"),1400)}
out.addEventListener("toggle",e=>{const d=e.target;if(!d.dataset||!d.dataset.p||q.value.trim())return;d.open?offen.add(d.dataset.p):offen.delete(d.dataset.p)},true);
out.addEventListener("click",e=>{
  const sg=e.target.closest("[data-such]");if(sg){q.value=sg.dataset.such;zeigen();return}
  const op=e.target.closest(".oeffne");if(op){oeffneMenue(op.dataset.key);return}
  const b=e.target.closest(".copy,[data-copy]"); if(!b) return;
  const text=b.dataset.copy||b.dataset.c.replace(/\s*<.*$/,"").replace(/\s*\[.*$/,"").replace(/\s+@user$/,"").trim();
  const fertig=()=>hinweis("Kopiert: "+text);
  try{if(window.Android&&Android.copy){Android.copy(text);fertig()}else navigator.clipboard.writeText(text).then(fertig,()=>hinweis("Kopieren nicht möglich"))}catch(_){hinweis("Kopieren nicht möglich")}
});

(function(){
  var C=window.CFG, K=document.getElementById("einst"), S=document.getElementById("einstSheet");
  function seg(key,opts){return '<div class="seg" role="radiogroup">'+opts.map(function(o){return '<button type="button" class="opt" role="radio" aria-checked="'+(C[key]===o[0])+'" aria-pressed="'+(C[key]===o[0])+'" data-k="'+key+'" data-v="'+o[0]+'">'+o[1]+'</button>'}).join("")+'</div>'}
  function tog(key,t,s){return '<div class="tog"><span>'+t+(s?'<small>'+s+'</small>':'')+'</span><button type="button" class="sch" role="switch" aria-checked="'+(!!C[key])+'" aria-label="'+t+'" data-t="'+key+'"></button></div>'}
  function bauen(){
    var sw=Object.keys(C.FARBEN).map(function(k){var f=C.FARBEN[k];return '<button type="button" class="sw" aria-label="'+f[0]+'" aria-pressed="'+(C.farbe===k)+'" data-k="farbe" data-v="'+k+'" style="background:linear-gradient(135deg,'+f[1]+','+f[2]+')"></button>'}).join("");
    S.innerHTML='<div class="sk"><h2>EINSTELLUNGEN</h2><button type="button" class="zu" id="einstZu" aria-label="Schließen">✕</button></div>'+
    '<div class="grp"><h3>Sprache der Befehle</h3>'+seg("sprache",[["de","Deutsch"],["en","English"]])+'<p class="hinw">English: Befehle werden englisch angezeigt und kopiert, zum Beispiel -quests collect statt -aufgaben abholen. Beide Namen funktionieren im Bot.</p></div>'+
    '<div class="grp"><h3>Updates</h3>'+tog("autoupdate","Automatisch aktualisieren","Neue Version wird beim Öffnen von selbst geladen und installiert")+'<p class="hinw">Ohne Nachfrage geht das ab Android 12, nachdem die App einmal über das In-App-Update installiert wurde. Sonst fragt Android kurz nach.</p></div>'+
    '<div class="grp"><h3>Modus</h3>'+seg("mode",[["dunkel","Dunkel"],["hell","Hell"],["system","System"]])+'</div>'+
    '<div class="grp"><h3>Farbe</h3><div class="sws">'+sw+'</div></div>'+
    '<div class="grp"><h3>Punkte im Hintergrund</h3>'+tog("netz","Punkte anzeigen","Das schwebende Netz hinter der App")+
      (C.netz?'<div><div class="hinw" style="margin-bottom:8px">Menge</div>'+seg("dichte",[["wenig","Wenig"],["mittel","Mittel"],["viel","Viel"]])+'</div>'+
      '<div><div class="hinw" style="margin-bottom:8px">Geschwindigkeit</div>'+seg("tempo",[["langsam","Langsam"],["normal","Normal"],["schnell","Schnell"]])+'</div>'+
      tog("beruehrung","Linien beim Berühren","Punkte verbinden sich mit deinem Finger"):'')+'</div>'+
    '<div class="grp"><h3>Darstellung</h3><div><div class="hinw" style="margin-bottom:8px">Textgröße</div>'+seg("text",[["klein","Klein"],["normal","Normal"],["gross","Groß"]])+'</div>'+
      tog("kompakt","Kompakte Abstände","Mehr Befehle auf einmal sichtbar")+
      tog("laden","Ladebildschirm beim Start","Gilt ab dem nächsten Öffnen")+'</div>'+
    '<div class="grp"><button type="button" class="reset" id="einstReset">Alles zurücksetzen</button><p class="hinw">Deine Einstellungen werden auf diesem Gerät gespeichert.</p></div>';
  }
  window.einstZeigen=function(){var y=S.scrollTop;bauen();S.scrollTop=y};
  var sy=0;
  function sperre(an){var d=document.documentElement,b=document.body;if(an){sy=window.scrollY;b.style.top=(-sy)+"px";d.classList.add("einstOffen")}else{d.classList.remove("einstOffen");b.style.top="";window.scrollTo(0,sy)}}
  function auf(){bauen();K.classList.add("auf");sperre(true);var z=document.getElementById("einstZu");if(z)z.focus()}
  function zu(){K.classList.remove("auf");sperre(false);document.getElementById("gear").focus()}
  document.getElementById("gear").addEventListener("click",auf);
  K.addEventListener("click",function(e){
    var t=e.target;
    if(t.id==="einstShade"||t.id==="einstZu"){zu();return}
    if(t.id==="einstReset"){C.zurueck();return}
    var o=t.closest("[data-k]");if(o){C.set(o.dataset.k,o.dataset.v);return}
    var s=t.closest("[data-t]");if(s){C.set(s.dataset.t,!C[s.dataset.t])}
  });
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&K.classList.contains("auf"))zu()});
})();

/* Update-Prüfung: still im Hintergrund. Ohne Internet oder bei Fehlern passiert nichts. */
(function(){
  if(!BUILD)return;
  var bar=document.getElementById("upd");
  document.getElementById("updX").addEventListener("click",function(){bar.classList.remove("auf");document.documentElement.classList.remove("updOffen")});
  function pruefen(){
    try{
      if(navigator.onLine===false||!window.fetch)return;
      var ac=window.AbortController?new AbortController():null, t=setTimeout(function(){if(ac)ac.abort()},8000);
      fetch("https://api.github.com/repos/MaxxtheBass/THEBot-App/releases/latest",{headers:{Accept:"application/vnd.github+json"},cache:"no-store",signal:ac?ac.signal:undefined})
        .then(function(r){clearTimeout(t);return r.ok?r.json():null})
        .then(function(j){
          if(!j||!j.tag_name)return;
          var n=parseInt(String(j.tag_name).replace(/\D/g,""),10);
          if(n&&n>BUILD){bar.classList.add("auf");document.documentElement.classList.add("updOffen");auto(n)}
        })
        .catch(function(){});
    }catch(e){}
  }
  setTimeout(pruefen,3500);
  /* In der App: APK direkt laden und installieren (sonst normaler Link zum Browser) */
  var link=document.getElementById("updLink"), titel=link.firstChild, klein=link.querySelector("small"), laeuft=false;
  window.updStatus=function(z,p){
    if(z==="lade"){titel.nodeValue="Lade Update … "+p+" %";klein.textContent="Bitte kurz warten"}
    else if(z==="install"){titel.nodeValue="Installiere …";klein.textContent="Bestätige die Installation"}
    else{laeuft=false;titel.nodeValue="Update nicht geklappt";klein.textContent="Tippen für einen neuen Versuch"}
  };
  /* Automatisch: pro neuer Version nur ein Versuch, damit es keine Schleife gibt */
  function auto(n){
    try{
      if(!window.Android||!Android.install||laeuft||(window.CFG&&CFG.autoupdate===false))return;
      var k="thebot-autoupd", v=null; try{v=localStorage.getItem(k)}catch(e){}
      if(String(v)===String(n))return;
      try{localStorage.setItem(k,String(n))}catch(e){}
      laeuft=true;titel.nodeValue="Lade Update … 0 %";klein.textContent="Automatisches Update";
      if(Android.installAuto)Android.installAuto(link.href);else Android.install(link.href);
    }catch(x){window.updStatus&&window.updStatus("fehler",0)}
  }
  link.addEventListener("click",function(e){
    if(!window.Android||!Android.install)return;
    e.preventDefault();
    if(laeuft)return;
    laeuft=true;titel.nodeValue="Lade Update … 0 %";klein.textContent="Bitte kurz warten";
    try{Android.install(link.href)}catch(x){window.updStatus("fehler",0)}
  });
})();
</script>
