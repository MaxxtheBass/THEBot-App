name: APK bauen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md", "werbung/**"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Signaturschlüssel bereitstellen
        env: { KS_B64: "${{ secrets.KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > app/thebot.keystore; fi
          test -f app/thebot.keystore || { echo "Kein Signaturschlüssel gefunden"; exit 1; }
      - name: Build-Nummer eintragen
        run: sed -i -E "s#/\*BUILD\*/[0-9]+/\*END\*/#/*BUILD*/${{ github.run_number }}/*END*/#" app/src/main/assets/index.html
      - name: APK bauen
        env: { KS_PASS: "${{ secrets.KS_PASS }}" }
        run: gradle --no-daemon -PvCode=${{ github.run_number }} assembleRelease
      - name: Als Release veröffentlichen
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/release/app-release.apk THE-Bot.apk
          gh release create "b${{ github.run_number }}" "THE-Bot.apk#THE Bot.apk" --latest --title "THE Bot (APK), Build ${{ github.run_number }}" --notes "Zum Installieren auf Android herunterladen: THE Bot.apk"
          for t in $(gh release list --json tagName -q '.[].tagName'); do
            [ "$t" = "b${{ github.run_number }}" ] || gh release delete "$t" --yes --cleanup-tag
          done
